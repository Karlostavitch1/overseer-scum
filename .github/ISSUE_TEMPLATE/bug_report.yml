name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: overseer-version
    attributes:
      label: Overseer version
      description: Output of `overseer.version`, or the commit SHA
    validations:
      required: true
  - type: input
    id: scum-version
    attributes:
      label: SCUM server build
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `overseer/logs/native.log`. Remove passwords and player IDs.
      render: text
