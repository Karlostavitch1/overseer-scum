name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore managed/Overseer.sln

      - name: Check formatting
        # Advisory until the codebase has been through `dotnet format` once.
        continue-on-error: true
        run: dotnet format managed/Overseer.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test managed/Overseer.sln -c Release --no-restore --logger "console;verbosity=normal"

      - name: Package (native + managed)
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - uses: actions/upload-artifact@v7
        with:
          name: overseer-${{ github.sha }}
          path: dist/
          if-no-files-found: error
